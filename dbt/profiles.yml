nitidrishti:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'nitidrishti') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'change_me_locally') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'nitidrishti_db') }}"
      schema: dbt_nitidrishti
      threads: 2
      keepalives_idle: 0
      connect_timeout: 10
      search_path: "dbt_nitidrishti,public"
