name: ci

on:
  push:
    branches: [main, master, "step*", "de*", "feat*", "fix*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-de.txt || pip install minio
      - name: Ruff (selected modules)
        run: |
          ruff check app/services/ingestion/object_store.py \
            app/services/ingestion/snapshot.py \
            app/services/ingestion/layers.py \
            app/services/ingestion/scheduler.py \
            scripts/pipeline_stages.py \
            scripts/migrate_raw_to_minio.py \
            tests/test_object_store.py \
            tests/test_ingest_scheduler.py \
            tests/test_pipeline_layers.py
      - name: Pytest (unit + ingestion + AST + DQ)
        env:
          APP_ENV: testing
          RATE_LIMIT_ENABLED: "false"
          PIPELINE_ORCHESTRATOR: airflow
        run: pytest -q --ignore=tests/test_district_analytics.py

  data-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DE extras
        run: |
          pip install -r backend/requirements.txt
          pip install minio "pyspark==3.5.4" "dbt-core>=1.8,<1.9" "dbt-postgres>=1.8,<1.9"
      - name: Airflow DAG structure tests
        run: python -m pytest tests/test_airflow_dag.py -q
      - name: Spark silver unit tests
        run: python -m pytest tests/test_spark_silver.py -q
      - name: dbt parse
        working-directory: dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: nitidrishti
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: nitidrishti_db
        run: dbt parse --profiles-dir . || dbt parse --profiles-dir . --no-version-check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          # Non-secret placeholder so `:?` interpolation can be parsed. Not a deploy key.
          AIRFLOW_FERNET_KEY: ci-compose-config-placeholder
        run: docker compose -f docker-compose.yml config

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan tracked files and history
        run: ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --exit-code 1
