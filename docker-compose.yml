# NitiDrishti data-engineering stack (Airflow + MinIO + Airflow metadata DB).
# Application PostgreSQL remains the host/native DB (do not reset production data).
# Startup: docker compose up -d
# Note: requires Docker Desktop. If Docker is unavailable, use PIPELINE_ORCHESTRATOR=airflow
# with a remote Airflow, or temporarily PIPELINE_ORCHESTRATOR=apscheduler for local-only.

name: nitidrishti

services:
  minio:
    # Docker Hub minio/minio removed (repo 404). Official server binary is still
    # published on GitHub for RELEASE.2025-09-07T16-13-09Z (linux-amd64 verified).
    # Later RELEASE.2025-10-15T17-29-55Z is source-only (no release assets).
    image: nitidrishti-minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: build
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    # Docker Hub minio/mc removed (repo 404). Official client release is still
    # published on GitHub; build a pinned local image from that binary.
    # Release verified: RELEASE.2025-08-13T08-35-41Z (latest non-prerelease on minio/mc).
    image: nitidrishti-mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: build
    build:
      context: ./docker/mc
      dockerfile: Dockerfile
      args:
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/nitidrishti-raw || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      PIPELINE_ORCHESTRATOR: airflow

      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-nitidrishti_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DATABASE_URL: ${DATABASE_URL:-postgresql://nitidrishti:change_me_locally@host.docker.internal:5432/nitidrishti_db}

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: nitidrishti-raw
      PYTHONPATH: /opt/nitidrishti/backend:/opt/nitidrishti
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/nitidrishti/backend
      - ./spark_jobs:/opt/nitidrishti/spark_jobs
      - ./dbt:/opt/nitidrishti/dbt
      - ./storage:/opt/nitidrishti/storage
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet --no-cache-dir minio boto3 'psycopg[binary]' sqlalchemy pydantic pydantic-settings structlog beautifulsoup4 lxml pypdf openpyxl requests apscheduler alembic PyJWT argon2-cffi python-dotenv 'pyspark==3.5.4' 'dbt-postgres==1.8.2' || true
        airflow db migrate
        airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME}" --password "$${_AIRFLOW_WWW_USER_PASSWORD}" --firstname Niti --lastname Drishti --role Admin --email admin@nitidrishti.local || true

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: *airflow_env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/nitidrishti/backend
      - ./spark_jobs:/opt/nitidrishti/spark_jobs
      - ./dbt:/opt/nitidrishti/dbt
      - ./storage:/opt/nitidrishti/storage
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/nitidrishti/backend
      - ./spark_jobs:/opt/nitidrishti/spark_jobs
      - ./dbt:/opt/nitidrishti/dbt
      - ./storage:/opt/nitidrishti/storage
    command: scheduler

volumes:
  minio_data:
  airflow_pg:
