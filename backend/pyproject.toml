[project]
name = "nitidrishti-backend"
version = "0.1.0"
description = "NitiDrishti API — welfare and opportunity intelligence from official government sources"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/data/official_schemes.py" = ["RUF001"]
"app/data/india_geography.py" = ["RUF001"]
"app/services/ingestion/serialize.py" = ["RUF001"]
"app/services/ingestion/extractors.py" = ["RUF001"]
"app/services/assistant.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
